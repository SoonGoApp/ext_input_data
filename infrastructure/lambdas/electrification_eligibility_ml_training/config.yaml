# Output directories
models_dir: "electrification_eligibility_models"

# Bucket Name
bucket_name: "soongo-staging-ml-models"

# Model configuration
model_type: "random_forest"
model_params:
    n_estimators: 300
    max_depth: 6
    min_samples_split: 10
    min_samples_leaf: 4
    max_features: "sqrt"
    class_weight: {0: 10, 1: 1}
    random_state: 42
    n_jobs: -1

target_threshold_km: 300.0

# Training parameters
test_size: 0.3

# Feature selection
feature_selection:
  method: "importance"
  top_n_features: 30