# Output directories
models_dir: "electrification_eligibility_models"

# Bucket Name
bucket_name: "soongo-staging-ml-models"

# Model configuration
model_type: "random_forest" # Options: random_forest, gradient_boosting, logistic
target_threshold_km: 300.0

# Training parameters
test_size: 0.3
random_state: 42

# Feature selection
feature_selection:
  method: "importance"
  top_n_features: 30
